<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="stats">
        <div class="stat"><span class="stat__label" data-t="moves"></span><span class="stat__value" id="moves">0</span></div>
        <div class="stat"><span class="stat__label" data-t="time"></span><span class="stat__value" id="time">0:00</span></div>
        <div class="stat"><span class="stat__label" data-t="best"></span><span class="stat__value" id="best">—</span></div>
      </div>
      <div class="controls">
        <div class="levels" role="radiogroup" id="levels"></div>
        <button class="btn" id="restart" type="button" data-t="restart"></button>
      </div>
    </header>

    <section class="board" id="board" aria-live="polite"></section>

    <div class="overlay hidden" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="card-panel">
        <h1 id="win-title" data-t="won"></h1>
        <p id="win-text"></p>
        <button class="btn btn--primary" id="again" type="button" data-t="again"></button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
